<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>SafeWave-AI Monitor</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; margin: 0; padding: 20px; }
    h1 { color: #4fc3f7; margin-bottom: 4px; }
    .subtitle { color: #888; font-size: 13px; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .card { background: #1e2130; border-radius: 12px; padding: 18px; border-left: 4px solid #4fc3f7; }
    .card.critical { border-left-color: #ff5252; background: #2a1a1a; }
    .card.warning  { border-left-color: #ffb300; background: #2a2210; }
    .card.normal   { border-left-color: #69f0ae; background: #1a2a1e; }
    .card-title { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .card-value { font-size: 28px; font-weight: bold; }
    .card-sub { font-size: 13px; color: #aaa; margin-top: 4px; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .badge.critical { background: #ff5252; color: #fff; }
    .badge.warning  { background: #ffb300; color: #000; }
    .badge.normal   { background: #69f0ae; color: #000; }
    #log { background: #1e2130; border-radius: 12px; padding: 16px; height: 260px; overflow-y: auto; font-size: 12px; font-family: monospace; }
    .log-line { padding: 4px 0; border-bottom: 1px solid #2a2d3a; }
    .log-line.critical { color: #ff7070; }
    .log-line.warning  { color: #ffcc44; }
    .log-line.normal   { color: #80e0a0; }
    #status-dot { width: 10px; height: 10px; border-radius: 50%; background: #69f0ae; display: inline-block; margin-right: 6px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    #status-dot.off { background: #ff5252; animation: none; }
    .conn-bar { display: flex; align-items: center; margin-bottom: 16px; font-size: 13px; color: #888; }
    #experts { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
    .exp-box { background: #252838; border-radius: 8px; padding: 12px; font-size: 13px; }
    .exp-label { color: #888; font-size: 11px; margin-bottom: 4px; }
  </style>
</head>
<body>
  <h1>SafeWave-AI 실내 모니터링</h1>
  <p class="subtitle">ESP32-S3 CSI → AI 추론 실시간 대시보드</p>

  <div class="conn-bar">
    <span id="status-dot" class="off"></span>
    <span id="conn-text">WebSocket 연결 중...</span>
  </div>

  <div class="grid">
    <div class="card" id="card-risk">
      <div class="card-title">위험도</div>
      <div class="card-value" id="risk-score">—</div>
      <div class="card-sub"><span class="badge" id="risk-badge">대기 중</span></div>
    </div>
    <div class="card" id="card-fall">
      <div class="card-title">낙상 감지 (M1)</div>
      <div class="card-value" id="fall-val">—</div>
      <div class="card-sub" id="fall-sub">score: —</div>
    </div>
    <div class="card" id="card-vital">
      <div class="card-title">바이탈 사인 (M2)</div>
      <div class="card-value" id="heart-val">— bpm</div>
      <div class="card-sub" id="breath-val">호흡: — /min</div>
    </div>
    <div class="card" id="card-activity">
      <div class="card-title">행동 분류 (M3)</div>
      <div class="card-value" id="act-val">—</div>
      <div class="card-sub" id="act-conf">신뢰도: —</div>
    </div>
    <div class="card" id="card-occ">
      <div class="card-title">재실 감지 (M4)</div>
      <div class="card-value" id="occ-val">—</div>
      <div class="card-sub" id="occ-score">score: —</div>
    </div>
  </div>

  <h3 style="color:#aaa; font-size:14px; margin-bottom:8px;">실시간 로그</h3>
  <div id="log"></div>

  <script>
    function detectApiBase() {
      const params = new URLSearchParams(window.location.search);
      const apiParam = params.get('api');
      if (apiParam) {
        return apiParam.replace(/\/$/, '');
      }

      // file:// 로 여는 경우에는 호스트 정보를 알 수 없으므로 localhost 기본값 사용
      if (window.location.protocol === 'file:') {
        return 'http://localhost:8000';
      }

      // http(s)://로 열면 현재 접속 호스트를 그대로 쓰고 API 포트(8000)만 고정
      const proto = window.location.protocol;
      const host = window.location.hostname;
      return `${proto}//${host}:8000`;
    }

    function detectWsUrl(apiBase) {
      const params = new URLSearchParams(window.location.search);
      const wsParam = params.get('ws');
      if (wsParam) {
        return wsParam;
      }
      return apiBase.replace(/^http/, 'ws') + '/ws/monitor';
    }

    const API = detectApiBase();
    const WS  = detectWsUrl(API);
    let ws;

    function parseResult(raw) {
      // raw가 Python dict 문자열인 경우 JSON으로 변환
      try {
        if (typeof raw === 'string') {
          raw = raw
            .replace(/'/g, '"')
            .replace(/True/g, 'true')
            .replace(/False/g, 'false')
            .replace(/None/g, 'null');
        }
        return typeof raw === 'object' ? raw : JSON.parse(raw);
      } catch(e) { return null; }
    }

    function updateUI(data) {
      const level = data.risk_level || 'normal';
      const score = (data.risk_score || 0).toFixed(2);
      const ex    = data.experts || {};

      // 위험도 카드
      document.getElementById('risk-score').textContent = score;
      const badge = document.getElementById('risk-badge');
      badge.textContent = level === 'critical' ? '응급' : level === 'warning' ? '경고' : '정상';
      badge.className = 'badge ' + level;
      document.getElementById('card-risk').className = 'card ' + level;

      // 낙상
      if (ex.fall) {
        document.getElementById('fall-val').textContent = ex.fall.fall_detected ? '🚨 감지됨' : '✅ 없음';
        document.getElementById('fall-sub').textContent = 'score: ' + (ex.fall.fall_score||0).toFixed(2);
        document.getElementById('card-fall').className = 'card ' + (ex.fall.fall_detected ? 'critical' : 'normal');
      }

      // 바이탈
      if (ex.vital) {
        document.getElementById('heart-val').textContent = (ex.vital.heart_rate||0).toFixed(0) + ' bpm';
        document.getElementById('breath-val').textContent = '호흡: ' + (ex.vital.breathing_rate||0).toFixed(0) + ' /min';
      }

      // 행동
      if (ex.activity) {
        const actMap = {idle:'정지',walking:'보행',sitting:'앉음',lying:'누움',unknown:'알 수 없음'};
        document.getElementById('act-val').textContent = actMap[ex.activity.activity] || ex.activity.activity;
        document.getElementById('act-conf').textContent = '신뢰도: ' + ((ex.activity.activity_confidence||0)*100).toFixed(0) + '%';
      }

      // 재실
      if (ex.occupancy) {
        document.getElementById('occ-val').textContent = ex.occupancy.occupied ? '🟢 있음' : '⚪ 없음';
        document.getElementById('occ-score').textContent = 'score: ' + (ex.occupancy.occupancy_score||0).toFixed(2);
        document.getElementById('card-occ').className = 'card ' + (ex.occupancy.occupied ? 'normal' : '');
      }

      // 로그 추가
      const log = document.getElementById('log');
      const t = new Date().toLocaleTimeString();
      const line = document.createElement('div');
      line.className = 'log-line ' + level;
      line.textContent = `[${t}] ${level.toUpperCase()}  risk=${score}  fall=${ex.fall?.fall_detected}  HR=${(ex.vital?.heart_rate||0).toFixed(0)}bpm  act=${ex.activity?.activity}`;
      log.prepend(line);
      // 최대 100줄
      while (log.children.length > 100) log.removeChild(log.lastChild);
    }

    function connect() {
      ws = new WebSocket(WS);
      ws.onopen = () => {
        document.getElementById('status-dot').classList.remove('off');
        document.getElementById('conn-text').textContent = `WebSocket 연결됨 · ${WS}`;
      };
      ws.onmessage = (e) => {
        let msg;
        try { msg = JSON.parse(e.data); } catch { return; }
        const parsed = parseResult(msg.data || msg);
        if (parsed) updateUI(parsed);
      };
      ws.onclose = () => {
        document.getElementById('status-dot').classList.add('off');
        document.getElementById('conn-text').textContent = '연결 끊김 · 3초 후 재연결...';
        setTimeout(connect, 3000);
      };
      ws.onerror = () => ws.close();
    }

    // 최초 /status 폴링 (WebSocket 연결 전 초기값)
    fetch(API + '/status')
      .then(r => r.json())
      .then(d => { const p = parseResult(d.raw || d); if(p) updateUI(p); })
      .catch(() => {});

    connect();
  </script>
</body>
</html>
