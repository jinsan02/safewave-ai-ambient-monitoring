# Redis tuned for RP5 local data hub
bind 0.0.0.0
protected-mode no
port 6379

# Persistence for reliable short-horizon history
appendonly yes
appendfsync everysec
save 300 10
save 60 10000

# Keep memory bounded on shared SBC resources
maxmemory 512mb
maxmemory-policy allkeys-lru

# Stream internals tuned for frequent small writes
stream-node-max-bytes 4096
stream-node-max-entries 100

# Runtime and logging
tcp-keepalive 60
loglevel notice
dir /data