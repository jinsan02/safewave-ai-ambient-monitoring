# Redis tuned for RP5 local data hub
bind 0.0.0.0
protected-mode no
port 6379

# Memory-only runtime: no AOF/RDB persistence on disk
appendonly no
save ""

# Keep memory bounded on shared SBC resources
maxmemory 512mb
maxmemory-policy allkeys-lru

# Stream internals tuned for frequent small writes
stream-node-max-bytes 4096
stream-node-max-entries 100

# Runtime and logging
tcp-keepalive 60
loglevel notice
dir /tmp