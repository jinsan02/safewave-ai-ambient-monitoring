# Redis tuned for RP5 local data hub
bind 0.0.0.0
protected-mode no
port 6379

# Memory-only runtime: no AOF/RDB persistence on disk
appendonly no
save ""

# Keep memory bounded on shared SBC resources
maxmemory 512mb
# 모든 운영 키는 코드의 TTL/MAXLEN으로 경계를 갖는다. 임계 도달 시 설정·락·스트림을
# 조용히 삭제하는 allkeys-lru보다 쓰기 실패를 노출해 원인을 보존한다.
maxmemory-policy noeviction

# Stream internals tuned for frequent small writes
stream-node-max-bytes 4096
stream-node-max-entries 100

# Runtime and logging
tcp-keepalive 60
loglevel notice
dir /tmp
