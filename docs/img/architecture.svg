<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 0 1094 472" width="1094" height="472" role="img" aria-label="ESP32-S3 CSI와 마이크 오디오가 sensing·audio-sensing을 거쳐 Redis Streams로 들어가고, ai-experts(M1~M4)와 ai-qwen(M5)이 읽고 써서 ai:emergency를 만들며, api의 경보 워커가 FCM 푸시와 음성 확인으로 보호자에게 알린다">
