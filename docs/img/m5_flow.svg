<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 0 1024 434" width="1024" height="434" role="img" aria-label="ai:result 스냅샷이 게이트 0.6 이상이면 프롬프트 프로필(rpi5 또는 laptop)로 Qwen2.5-1.5B Q5_K_M을 부르고, 판정표 하한과 등급 우선을 거쳐 ai:emergency에 쓴다. 확정 규칙 경보는 M5 없이 critical로 바로 쓴다">
<title>M5 판단 흐름 — 프롬프트 프로필과 판정표 하한</title>
<style>
