services:
  db:
    build: ./db
    container_name: rp5-db
    restart: always
    ports:
      - "6379:6379"
    networks:
      - rp5-network

  sensing:
    build: ./sensing
    container_name: rp5-sensing
    restart: always
    depends_on:
      - db
    env_file: .env
    environment:
      - REDIS_HOST=db
    ports:
      - "5005:5005/udp"
    networks:
      - rp5-network

  mqtt:
    image: eclipse-mosquitto:2
    container_name: rp5-mqtt
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./volumes/mosquitto:/mosquitto/data
      - ./volumes/logs/mosquitto:/mosquitto/log
    networks:
      - rp5-network

  audio-sensing:
    build: ./sensing
    container_name: rp5-audio-sensing
    restart: always
    profiles:
      - audio
    depends_on:
      - db
    env_file: .env
    environment:
      - REDIS_HOST=db
      - AUDIO_SAMPLE_RATE=16000
      - AUDIO_CHANNELS=1
      - AUDIO_BLOCK_SIZE=1024
      - VAD_THRESHOLD_DB=-45
      - VAD_MIN_ACTIVE_MS=300
      - VAD_HANGOVER_MS=250
      - AUDIO_MAX_EVENT_SECONDS=6
    command: ["python", "audio_main.py"]
    devices:
      - "/dev/snd:/dev/snd"
    networks:
      - rp5-network

  ai-experts:
    build:
      context: ./ai
      target: ${AI_DOCKER_TARGET:-gpu-runtime}
    container_name: rp5-ai-experts
    restart: always
    depends_on:
      - db
      - mqtt
    env_file: .env
    environment:
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
      - MQTT_BASE_TOPIC=safewave
      - MQTT_ENABLED=1
      - EXPERT_INFER_TIMEOUT_MS=1000
      - ORT_USE_GPU=${ORT_USE_GPU:-0}
    volumes:
      - ./volumes/models:/app/models
    networks:
      - rp5-network

  ai-qwen:
    build:
      context: ./ai
      target: ${AI_DOCKER_TARGET:-gpu-runtime}
    container_name: rp5-ai-qwen
    restart: always
    depends_on:
      - db
      - ai-experts
    env_file: .env
    environment:
      - REDIS_HOST=db
      - SLM_MIN_INTERVAL_MS=3000
      - ORT_USE_GPU=${ORT_USE_GPU:-0}
    volumes:
      - ./volumes/models:/app/models
    command: ["python3", "qwen_service.py"]
    networks:
      - rp5-network

  api:
    build: ./api
    container_name: rp5-api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - ai-experts
    env_file: .env
    volumes:
      - ./api/auth:/app/auth:ro
    networks:
      - rp5-network

  tts-worker:
    build: ./api
    container_name: rp5-tts-worker
    restart: always
    profiles:
      - audio
    depends_on:
      - mqtt
    env_file: .env
    environment:
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
      - TTS_VOICE=ko-KR-SunHiNeural
      - TTS_COOLDOWN_SEC=120
      - TTS_OUTPUT_DIR=/app/tts
    volumes:
      - ./volumes/logs/tts:/app/tts
    command: ["python", "/app/../scripts/tts_worker.py"]
    networks:
      - rp5-network

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: rp5-ha
    restart: always
    depends_on:
      - mqtt
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./volumes/ha_config:/config
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8123:8123"
    networks:
      - rp5-network

networks:
  rp5-network:
    driver: bridge